<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Onix Lunar Corp — Unlock the lunar supply chain</title>
<meta name="description" content="The Moon will supply the physical material needed to build the next generation of infrastructure in space. Kinetic launch enables this with the lowest cost per kg of material to low lunar orbit." />
<meta name="theme-color" content="#07080a" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="assets/favicon-180.png" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Onix Lunar Corp — Unlock the lunar supply chain" />
<meta property="og:description" content="The Moon will supply the physical material needed to build the next generation of infrastructure in space." />
<meta property="og:image" content="assets/og.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="image" href="assets/hero-1800.webp" imagesrcset="assets/hero-800.webp 800w, assets/hero-1200.webp 1200w, assets/hero-1800.webp 1800w, assets/hero-2560.webp 2560w" />
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=TASA+Orbiter:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="landing">

<div class="grain" aria-hidden="true"></div>

<a class="wordmark" href="/" aria-label="Onix Lunar Corp, home">
  <picture>
    <source type="image/webp" srcset="assets/onix-logo-header.webp" />
    <img class="wordmark-img" src="assets/onix-logo-header.png" width="470" height="96" alt="Onix" />
  </picture>
</a>

<main class="stage">
  <picture class="hero-plate">
    <source type="image/webp"
            srcset="assets/hero-800.webp 800w, assets/hero-1200.webp 1200w, assets/hero-1800.webp 1800w, assets/hero-2560.webp 2560w"
            sizes="100vw" />
    <img src="assets/hero-1800.jpg"
         srcset="assets/hero-800.jpg 800w, assets/hero-1200.jpg 1200w, assets/hero-1800.jpg 1800w, assets/hero-2560.jpg 2560w"
         sizes="100vw"
         alt="A gas gun on the lunar surface. The barrel runs along a ridge. Earth is above the horizon."
         fetchpriority="high" decoding="async" />
  </picture>

  <div class="dot-field" aria-hidden="true"></div>

  <div class="stage-copy">
    <div class="stage-copy-inner">
      <h1 class="hero-title">Unlock the lunar supply chain.</h1>
      <p class="hero-lede">
        The Moon will supply the physical material needed to build the next generation of
        infrastructure in space. Kinetic launch enables this with the lowest cost per kg of
        material to low lunar orbit, full stop.
      </p>
      <button class="signal" type="button" id="open-contact" aria-label="Contact us">
        <span class="signal-frame" aria-hidden="true">
          <span class="c tl"></span><span class="c tr"></span>
          <span class="c bl"></span><span class="c br"></span>
          <span class="e top"></span><span class="e right"></span>
          <span class="e bottom"></span><span class="e left"></span>
        </span>
        <span class="signal-label">Contact us</span>
      </button>
    </div>
  </div>

  <ul class="metrics" id="stat-strip" aria-label="Scale case"></ul>
</main>

<div class="modal" id="contact-modal" hidden>
  <button class="modal-backdrop" type="button" id="close-contact-backdrop" aria-label="Close"></button>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="contact-title">
    <button class="modal-close" type="button" id="close-contact" aria-label="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" /></svg>
    </button>
    <h2 id="contact-title">Contact</h2>

    <form class="form" id="contact-form" name="contact" method="POST" action="/form.html" data-netlify="true" netlify netlify-honeypot="bot-field" novalidate>
      <input type="hidden" name="form-name" value="contact" />
      <p class="hp"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off" /></label></p>

      <div class="field">
        <label for="f-name">Name</label>
        <input id="f-name" name="name" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="f-email">Email</label>
        <input id="f-email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="f-msg">Message</label>
        <textarea id="f-msg" name="message" rows="3" required placeholder="Your message"></textarea>
      </div>

      <button class="button button-wide" type="submit">
        <span>Send</span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" /></svg>
      </button>
      <p class="form-note" id="form-note" role="status" aria-live="polite">
        We reply from a company address.
        <a href="privacy.html">Privacy</a>
      </p>
    </form>
  </div>
</div>

<script src="data/site.data.js"></script>
<script src="main.js"></script>
</body>
</html>
